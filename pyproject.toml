[project]
name = "apc_operations"
authors = [{ name = "APC", email = "admin@apc.com"}]
description = "APC Operations System for Shipping, Transportation, QC, Security, and Production"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe",
    "pypika @ git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2",
    "gunicorn @ git+https://github.com/frappe/gunicorn@54b59ca884c79dcf04d4882658a32bbaf17e999f",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "apc_operations"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
